  <text x="145" y="76" fill="#F2F2F2" font-family="monospace" font-size="17">B.Tech CSE Undergraduate</text>

  <!-- university -->
  <text x="35" y="107" fill="#B5179E" font-family="monospace" font-size="17" font-weight="bold">university:</text>


      <stop offset="100%" stop-color="#F97316"></stop>
    </linearGradient>
  </defs>

  <!-- Minimal dark background -->
  <rect x="2" y="2" width="946" height="346" rx="12" fill="#111318" stroke="url(#accent)" stroke-width="2"></rect>

